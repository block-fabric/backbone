syntax = "proto3";
package cusf.mainchain.v1;

import "cusf/common/v1/common.proto";
import "google/protobuf/wrappers.proto";

message GenerateToAddressRequest {
  // Defaults to 1.
  google.protobuf.UInt32Value blocks = 1;
  string address = 2;
}
message GenerateToAddressResponse {
  repeated cusf.common.v1.ReverseHex block_hashes = 1;
}

service MiningService {
  rpc GenerateToAddress(GenerateToAddressRequest) returns (GenerateToAddressResponse);
}
